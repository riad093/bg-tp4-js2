<!doctype html>
<html>
  <head>
    <title>TP4-Part2</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="form-container">
      <div class="form-group">
        <label class="form-field">Nom : </label>
        <input type="text" id="form_nom" class="form-field" />
      </div>
      <div class="form-group">
        <label class="form-field">prenom : </label>
        <input type="text" id="form_prenom" class="form-field" />
      </div>
      <div class="form-group">
        <label class="form-field">Point : </label>
        <input type="number" id="form_points" class="form-field" />
      </div>
      <button class="btn-add" onclick="doNewData()">Ajouter</button>
    </div>

    <div id="table_container">
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Points</th>
            <th>Select</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div id="container_summary">
        <p id="p1">0 lignes(s)</p>
        <p id="p2"></p>
        <p id="p3">Totale Point(s) = 0</p>
      </div>
      <div id="container_btn">
        <button class="btn-console" onclick="consoleTable()">Console Tableau</button>
        <button class="btn-delete" onclick="deleteRow()">Supprimer</button>
      </div>
    </div>
  </body>
</html>
